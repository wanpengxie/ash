/* Ash web components. Source: design/app/ash.css (the designer's reference), made usable in the page:

     everything else keeps the design's name
   Both files are inlined into the page by tools/gen-ui.mjs, tokens first, ahead of the page's own rules. */

/* ---------- 0. Shared variables and the aliases of the page's earlier colour names ---------- */
:root{
  --font:-apple-system,system-ui,"PingFang SC","MiSans","HarmonyOS Sans SC","Noto Sans SC",sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:20px; --r-xl:28px; --r-pill:999px;
  /* Earlier names, kept so pages not yet moved over take the new colours. New code uses the token names on the right. */
  --fg:var(--text); --mute:var(--text-2); --muted:var(--text-2);
  --me:var(--you); --me-fg:var(--on-you); --accent:var(--you);
  --card:var(--surface); --chip:var(--surface-2); --seg:var(--elev);
  /* --bg --line --ok --warn --err keep their names with the new meaning: --ok/--warn/--err are text tones; for a dot, badge or
     button fill use --ok-fill/--warn-fill/--err-fill. */
}

/* The page's base text: the design's font, text colour, tabular numbers (the design puts these on the screen wrapper). */
body{font-family:var(--font);color:var(--text);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}

/* ---------- 2. Type scale（中文为主，行高偏松） ---------- */
.tx-display{font-size:30px;line-height:38px;font-weight:700;letter-spacing:.01em;color:var(--ink)}
.tx-title{font-size:22px;line-height:30px;font-weight:650;color:var(--ink)}
.tx-headline{font-size:17px;line-height:24px;font-weight:600;color:var(--ink)}
.tx-body{font-size:15px;line-height:24px;color:var(--text)}
.tx-callout{font-size:14px;line-height:21px;color:var(--text-2)}
.tx-sub{font-size:13px;line-height:19px;color:var(--text-2)}
.tx-caption{font-size:11.5px;line-height:16px;color:var(--text-3)}
.tx-num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
/* 颜色工具类优先于组件默认色（例如顶栏状态文字「等你一句话」要是琥珀色） */
.c-her{color:var(--her)!important} .c-you{color:var(--you-text)!important} .c-ok{color:var(--ok)!important} .c-warn{color:var(--warn)!important} .c-err{color:var(--err)!important} .c-2{color:var(--text-2)!important} .c-3{color:var(--text-3)!important}

/* ---------- 3. Icons（24 网格，1.8 线宽，圆头圆角） ---------- */
.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.i-s{width:18px;height:18px}.i-xs{width:16px;height:16px;stroke-width:2}.i-l{width:26px;height:26px}
.i-solid{fill:currentColor;stroke:none}

/* ---------- 5. Avatar & presence ---------- */
.av{position:relative;flex:none;display:block}
.av img{width:100%;height:100%;display:block;object-fit:cover;object-position:50% 18%;background:var(--surface-2);border-radius:32%}
.av-28{width:28px;height:28px}.av-36{width:36px;height:36px}.av-40{width:40px;height:40px}.av-56{width:56px;height:56px}.av-88{width:88px;height:88px}.av-120{width:120px;height:120px}
.av-round img{border-radius:50%}
.av .dot{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;border:2.5px solid var(--bg);background:var(--ok-fill)}
.av .dot.off{background:var(--text-3)} .av .dot.warn{background:var(--warn-fill)}
/* 醒着：头像外一圈青色光环缓慢转动（在做事）；呼吸（在想） */
.av-live::before{content:"";position:absolute;inset:-3px;border-radius:36%;padding:1.6px;
  background:conic-gradient(from 0deg,var(--her-fill),transparent 40%,transparent 60%,var(--her-fill));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.av-breath::before{content:"";position:absolute;inset:-3px;border-radius:36%;border:1.6px solid var(--her-fill)}
.av-wait::before{content:"";position:absolute;inset:-3px;border-radius:36%;border:1.6px solid var(--warn-fill)}
.av-letter{display:flex;align-items:center;justify-content:center;border-radius:32%;font-weight:650;color:var(--on-helper)}
.av-tone-purple{background:var(--helper-purple)}.av-tone-blue{background:var(--helper-blue)}.av-tone-teal{background:var(--helper-teal)}.av-tone-green{background:var(--helper-green)}.av-tone-amber{background:var(--helper-amber)}.av-tone-rose{background:var(--helper-rose)}
.a-typing{display:inline-flex;gap:3px;vertical-align:middle}
.a-typing i{width:4px;height:4px;border-radius:50%;background:currentColor}
.spinner{width:14px;height:14px;border-radius:50%;border:2px solid var(--her-soft);border-top-color:var(--her-fill);flex:none}

/* ---------- 6. Top bar / tab bar ---------- */
.topbar{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 6px 0 14px}
.topbar .who{display:flex;align-items:center;gap:10px;flex:1;min-width:0;border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left}
.topbar .name{font-size:17px;line-height:22px;font-weight:650;color:var(--ink)}
.topbar .state{font-size:12px;line-height:16px;color:var(--text-2);display:flex;align-items:center;gap:5px;white-space:nowrap}
.state-dot{width:6px;height:6px;border-radius:50%;background:var(--ok-fill);flex:none}
.navbar{height:52px;flex:none;display:flex;align-items:center;gap:4px;padding:0 6px}
.navbar .ttl{flex:1;text-align:center;font-size:17px;font-weight:600;color:var(--ink)}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:none;color:var(--text);display:flex;align-items:center;justify-content:center;flex:none;padding:0;position:relative}
.iconbtn.fill{background:var(--surface-2)}
.badge{position:absolute;top:6px;right:6px;min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:8px;background:var(--err-fill);color:#fff;font-size:10.5px;line-height:16px;font-weight:600;text-align:center;border:2px solid var(--bg)}
.tabbar{flex:none;height:58px;padding-bottom:14px;display:flex;border-top:.5px solid var(--line);background:var(--bg)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;font:inherit;font-size:11px;color:var(--text-3);padding:6px 0 0}
.tab.on{color:var(--ink);font-weight:600}
.large-title{padding:6px 20px 14px}

/* ---------- 7. Conversation ---------- */
.stream{flex:1;min-height:0;overflow:hidden;padding:4px 14px 10px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 20px);mask-image:linear-gradient(to bottom,transparent 0,#000 20px)}
.daysep{align-self:center;font-size:11.5px;color:var(--text-3);margin:12px 0 6px}
.a-row{display:flex;flex-direction:column;gap:3px}
.a-row-me{align-items:flex-end}
.a-row-her{align-items:flex-start}
.b{max-width:80%;padding:10px 14px;font-size:15.5px;line-height:24px;border-radius:20px;word-break:break-word;box-sizing:border-box}
.b-me{background:var(--bubble-me);color:var(--on-me);border-bottom-right-radius:6px}
.b-her{background:var(--bubble-her);color:var(--text);border-bottom-left-radius:6px;position:relative;z-index:0}
/* Equal shadow radii avoid WebView's per-tile blur textures; the bubble keeps its small corners. */
.b-her::before{content:"";position:absolute;inset:0;border-radius:20px;box-shadow:var(--shadow-1);pointer-events:none;z-index:-1;contain:layout style;isolation:isolate}
.b-her.mid{border-top-left-radius:6px}
.b-me.mid{border-top-right-radius:6px}
.b-wide{max-width:92%}
.meta{font-size:11px;color:var(--text-3);padding:0 6px}
.meta-pending{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--text-2);padding:0 4px}
.byline{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);margin:6px 0 2px 2px}
.gap-s{height:10px;flex:none}
/* markdown in bubble */
.md h4{margin:2px 0 6px;font-size:16px;line-height:24px;font-weight:650;color:var(--ink)}
.md p{margin:0 0 8px}.md p:last-child{margin-bottom:0}
.md ul,.md ol{margin:4px 0 8px;padding-left:20px}.md li{margin:2px 0}
.md b{font-weight:600;color:var(--ink)}
.md code{font-family:var(--mono);font-size:13px;background:var(--code-bg);padding:1px 5px;border-radius:5px}
.md a{color:var(--you-text);text-decoration:none;border-bottom:1px solid currentColor}
.codeblk{margin:6px 0 8px;border-radius:12px;background:var(--code-bg);overflow:hidden;border:1px solid var(--line)}
.codeblk .hd{display:flex;align-items:center;justify-content:space-between;height:32px;padding:0 6px 0 12px;font-size:11.5px;color:var(--text-3);border-bottom:1px solid var(--line)}
.codeblk pre{margin:0;padding:10px 12px;font:12.5px/19px var(--mono);color:var(--text);white-space:pre;overflow:hidden}
.tbl{margin:6px 0 8px;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13.5px;line-height:20px}
.tbl table{border-collapse:collapse;width:100%}
.tbl th{text-align:left;font-weight:600;color:var(--text-2);font-size:12px;background:var(--surface-2);padding:7px 10px}
.tbl td{padding:8px 10px;border-top:1px solid var(--line)}
/* attachments */
.att-img{width:200px;height:150px;border-radius:16px;overflow:hidden;background:var(--surface-3);position:relative}
.att-file{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);min-width:220px;box-sizing:border-box}
.att-file .ic{width:36px;height:36px;border-radius:10px;background:var(--you-soft);color:var(--you-text);display:flex;align-items:center;justify-content:center}

/* ---------- 8. Cards in stream ---------- */
.a-card{width:100%;max-width:330px;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-1)}
.card-hd{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600}
.card-hd .chip-ic{width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.card-hd .exp{margin-left:auto;font-weight:400;color:var(--text-3);font-size:11.5px}
.card-title{font-size:16px;line-height:23px;font-weight:600;color:var(--ink)}
.card-body{font-size:14px;line-height:21px;color:var(--text-2)}
.card-note{font-size:13px;line-height:19px;color:var(--text-2);background:var(--surface-2);border-radius:12px;padding:9px 11px}
.card-link{display:flex;align-items:center;gap:2px;font-size:13px;color:var(--you-text);border:0;background:none;padding:0;font-family:inherit;align-self:flex-start;min-height:28px}
.card-acts{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.card-acts .two{display:flex;gap:8px}.card-acts .two>*{flex:1}
.resolved{height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13.5px;color:var(--text-2);background:var(--surface-2)}
.resolved.ok{color:var(--ok);background:var(--ok-soft)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{height:40px;padding:0 15px;border-radius:20px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.opt.on{background:var(--you);border-color:var(--you);color:#fff}
.opt.dim{opacity:.4}
.say{display:flex;align-items:center;gap:8px;height:40px;border-radius:20px;background:var(--surface-2);padding:0 6px 0 14px;font-size:14px;color:var(--text-3)}
.say .sbtn{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--surface-3);color:var(--text-2);display:flex;align-items:center;justify-content:center}

/* ---------- 9. Buttons ---------- */
.a-btn{height:44px;padding:0 20px;border-radius:22px;border:0;font:inherit;font-size:16px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;box-sizing:border-box}
.btn-primary{background:var(--you);color:var(--on-you)}
.btn-secondary{background:var(--you-soft);color:var(--you-text)}
.btn-neutral{background:var(--surface-2);color:var(--ink)}
.btn-ink{background:var(--ink);color:var(--on-ink)}
.btn-danger{background:var(--err-soft);color:var(--err)}
.btn-ghost{background:none;color:var(--you-text);padding:0 10px}
.btn-sm{height:34px;padding:0 14px;font-size:13.5px;border-radius:17px}
.btn-lg{height:52px;border-radius:26px;font-size:16px}
.btn-block{width:100%}
.a-btn[disabled]{opacity:.4}

/* ---------- 10. Progress pill / chips above composer ---------- */
.dock{flex:none;display:flex;justify-content:center;padding:6px 14px 2px;gap:8px}
.pill{height:32px;border-radius:16px;padding:0 10px 0 10px;background:var(--elev);border:1px solid var(--line);box-shadow:var(--shadow-1);display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2);white-space:nowrap}
.pill b{font-weight:600;color:var(--ink)}
.ctx{height:30px;border-radius:15px;padding:0 4px 0 12px;background:var(--you-soft);color:var(--you-text);display:inline-flex;align-items:center;gap:4px;font-size:12.5px}

/* ---------- 11. Composer ---------- */
.composer{flex:none;display:flex;align-items:flex-end;gap:8px;padding:8px 10px 24px}
.field{flex:1;min-height:44px;border-radius:22px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 6px 0 5px;box-sizing:border-box}
.field .to{width:34px;height:34px;border-radius:50%;border:0;background:none;padding:0;position:relative;flex:none}
.field .to img{width:28px;height:28px;border-radius:32%;object-fit:cover;object-position:50% 18%;margin:3px}
.field .ph{flex:1;font-size:15px;color:var(--text-3)}
.field .txt{flex:1;font-size:15px;color:var(--text)}
.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--you);color:var(--on-you);display:flex;align-items:center;justify-content:center;flex:none}
.send.idle{background:var(--surface-2);color:var(--text-3)}
.plus{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface-2);color:var(--text);display:flex;align-items:center;justify-content:center;flex:none}

/* ---------- 12. Lists / groups / switch ---------- */
.page{flex:1;min-height:0;overflow:hidden;padding:0 16px 16px;display:flex;flex-direction:column;gap:20px}
.group{display:flex;flex-direction:column;gap:8px}
.group-ttl{font-size:13px;color:var(--text-2);padding:0 6px}
.group-foot{font-size:12px;line-height:18px;color:var(--text-3);padding:0 6px}
.list{background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-1)}
.li{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;box-sizing:border-box;position:relative}
.li+.li::before{content:"";position:absolute;top:0;left:54px;right:0;height:.5px;background:var(--line)}

<script>
// 卡片: the page. The host protocol (MCP Apps, JSON-RPC with the parent window or a MessagePort it hands over) is set up
// here in <head>, so the port the host gives at first draw is not missed; the list is drawn once the body is there.
(() => {
  let port = null, next = 0;
  const waiting = new Map();
  const post = (message) => port ? port.postMessage(JSON.stringify(message)) : window.parent.postMessage(message, "*");
  const theme = (context) => { if (context && (context.theme === "dark" || context.theme === "light")) document.documentElement.dataset.theme = context.theme; };
  const receive = (raw) => {
    let message = raw;
    if (typeof raw === "string") { try { message = JSON.parse(raw); } catch { return; } }
    if (!message || message.jsonrpc !== "2.0") return;
    if (message.id !== undefined && waiting.has(message.id) && !message.method) {
      const item = waiting.get(message.id); waiting.delete(message.id);
      message.error ? item.reject(new Error(message.error.message || "host error")) : item.resolve(message.result);
    } else if (message.method === "ui/notifications/host-context-changed") theme(message.params);
  };
  window.addEventListener("message", (event) => {
    if (!port && event.ports && event.ports[0]) { port = event.ports[0]; port.onmessage = (inner) => receive(inner.data); return; }
    receive(event.data);
  });
  const request = (method, params, ms = 30000) => new Promise((resolve, reject) => {
    const id = ++next; waiting.set(id, { resolve, reject });
    setTimeout(() => { if (waiting.delete(id)) reject(new Error("host did not answer")); }, ms);
    post({ jsonrpc: "2.0", id, method, params });
  });
  const ready = (async () => {
    await new Promise((resolve) => setTimeout(resolve, 50));
    const result = await request("ui/initialize", { protocolVersion: "2026-01-26", capabilities: {}, clientInfo: { name: "cards", version: "1.0.0" } }, 5000);
    theme(result && result.hostContext);
    post({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} });
    new ResizeObserver(() => post({ jsonrpc: "2.0", method: "ui/notifications/size-changed", params: { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight } })).observe(document.body);
  })();
  async function call(name, args = {}) {
    await ready;
    const result = await request("tools/call", { name, arguments: args }, 60000);
    if (!result || result.isError) throw new Error((result && result.content && result.content[0] && result.content[0].text) || "没做成");
    return result.structuredContent || {};
  }

  const el = (tag, attrs = {}, ...children) => {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) key === "class" ? node.className = value : node.setAttribute(key, value);
    for (const child of children) node.append(child);

  /** An error as the owner reads it: Ash's sentence in Chinese, never a code. */
  const say = (error) => {
    const message = error && error.message ? String(error.message) : "";
    if (/host did not answer/.test(message)) return "请在「Ash 应用」里打开卡片。";
    return /[一-鿿]/.test(message) ? message : "出了点问题，稍后再试";
  };
  /** 今天 09:30, 昨天 21:00, or 10月6日 08:00. */
  const when = (ts) => {
    if (typeof ts !== "number" || !(ts > 0)) return "";
    const d = new Date(ts), now = new Date();
    const hm = `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
    const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const ago = Math.round((day(now) - day(d)) / 86400000);
    return ago === 0 ? `今天 ${hm}` : ago === 1 ? `昨天 ${hm}` : `${d.getMonth() + 1}月${d.getDate()}日 ${hm}`;
  };
  const LIFE = { active: ["运行中", "tag-ok"], idle: ["闲置", "tag-mute"], dormant: ["休眠", "tag-her"], closed: ["已收起", "tag-mute"] };
  const whose = (card) => card.app_name || (card.app ? (card.temporary_app ? "一个临时应用" : "一个应用") : "Ash");

  let list, sum, note, busy = false;
  async function act(name, args, done) {
    if (busy) return;
    busy = true;
    for (const button of list.querySelectorAll("button")) button.disabled = true;
    try { await call(name, args); note.textContent = done; }
    catch (error) { note.textContent = `没做成：${say(error)}`; }
    busy = false;
    await load();

    const [life, tone] = LIFE[card.life] || LIFE.idle;
    const sources = Array.isArray(card.sources) ? card.sources.length : 0;

    const meta = [whose(card), sources ? `实时数据 ${sources} 项` : "", seen ? `上次看到 ${seen}` : ""].filter(Boolean).join(" · ");
    const acts = card.life === "closed" ? [] : [
      card.life === "dormant" ? button("唤醒", "btn-secondary", () => act("cards.wake", { id: card.id }, "已唤醒")) : button("休眠", "btn-neutral", () => act("cards.sleep", { id: card.id }, "已休眠")),
      button(card.pinned ? "取消固定" : "固定", "btn-neutral", () => act("cards.pin", { id: card.id, pinned: !card.pinned }, card.pinned ? "已取消固定" : "已固定，它会一直运行")),
      button("收起", "btn-danger", () => act("cards.close", { id: card.id }, "已收起")),
    ];
    return el("div", { class: "item" },
      el("div", { class: "txt tx-body" }, card.text || "一张卡片"),
      el("div", { class: "tags" }, el("span", { class: `tag ${tone}` }, life), ...(card.pinned ? [el("span", { class: "tag tag-you" }, "已固定")] : []), el("span", { class: "tx-sub" }, meta)),

  async function load() {
    try {
      const { cards = [], limits = {} } = await call("cards.list");
      const running = cards.filter((card) => card.life === "active").length;
      sum.textContent = cards.length ? `共 ${cards.length} 张，${running} 张在运行${limits.max_active ? `（同时最多 ${limits.max_active} 张）` : ""}` : "";
      list.replaceChildren(...(cards.length ? cards.map(row) : [el("div", { class: "empty-note tx-callout" }, "对话里现在没有在运行的卡片。")]));
    } catch (error) {
      sum.textContent = "";
      list.replaceChildren(el("div", { class: "item tx-callout c-warn" }, `没读到卡片：${say(error)}`));
    }
  }
  document.addEventListener("DOMContentLoaded", () => {
    list = document.getElementById("list"); sum = document.getElementById("sum"); note = document.getElementById("note");
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !busy) load(); });
    load();
  });
})();
</script>
</head>
<body>
<main class="pg">
  <h1 class="tx-title">运行中的卡片</h1>
  <p id="sum" class="tx-sub">正在读取…</p>
  <div id="list" class="cards"></div>
  <p id="note" class="tx-sub" role="status"></p>
</main>
</body>
</html>
