<h1>目标</h1>
<form id="form" class="card">
  <label class="label" for="weight">目标体重（kg）</label>
  <input id="weight" name="weight" type="number" inputmode="decimal" step="0.1" min="20" max="300">
  <label class="label" for="steps" style="display:block;margin-top:12px">每日步数</label>
  <input id="steps" name="steps" type="number" inputmode="numeric" step="500" min="500" max="100000">
  <label class="label" for="sleep" style="display:block;margin-top:12px">每晚睡眠（小时）</label>
  <input id="sleep" name="sleep" type="number" inputmode="decimal" step="0.5" min="3" max="14">
  <div class="row" style="margin:14px 0 0"><button type="submit">保存</button></div>
  <div id="out" class="sub"></div>
</form>
<script>
(() => {
  const { call } = window.health;
  const form = document.getElementById("form"), out = document.getElementById("out");
  call("health.today").then((today) => {
    const goals = today.goals || {};
    if (goals.weight) form.weight.value = goals.weight;
    if (goals.steps) form.steps.value = goals.steps;
    if (goals.sleep) form.sleep.value = Math.round(goals.sleep / 6) / 10;
  }).catch((error) => { out.textContent = /host did not answer/.test(error.message) ? "请在「Ash 应用」里打开健康。" : `没读到目标：${error.message}`; });
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const goals = [["weight", Number(form.weight.value)], ["steps", Number(form.steps.value)], ["sleep", Math.round(Number(form.sleep.value) * 60)]].filter(([, value]) => value > 0);
    if (!goals.length) { out.textContent = "至少填一项"; return; }
    try { for (const [metric, target] of goals) await call("health.goal.set", { metric, target }); out.textContent = "已保存"; }
    catch (error) { out.textContent = `没保存上：${error.message}`; }
  });
})();
</script>
