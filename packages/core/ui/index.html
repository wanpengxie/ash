<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141415" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Ash</title>
<!--
  ash's own personal-agent UI. No framework, no build step; it talks to ash only through the
  public SDK (`/api/*` + the SSE event stream), locally and through the gateway tunnel alike.
-->
<style>
:root{--bg:#f7f7f5;--fg:#1c1c1e;--mute:#8a8a8e;--line:#e6e6e3;--me:#2f6bff;--me-fg:#fff;--card:#fff;--chip:#efefec;--err:#d33;--ok:#2bb673;--warn:#f5a623}
@media (prefers-color-scheme:dark){:root{--bg:#141415;--fg:#ececee;--mute:#8d8d93;--line:#2a2a2d;--me:#3b74ff;--card:#1e1e20;--chip:#242427;--err:#ff6b6b}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,system-ui,"PingFang SC","Noto Sans SC",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:.6rem;padding:.65rem 1rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
header h1{font-size:1.05rem;margin:0;font-weight:650;letter-spacing:.02em}
header select{border:0;background:none;color:var(--fg);font:inherit;font-weight:650;font-size:1.05rem;padding:0;max-width:40vw}
#dot{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}#dot.idle{background:var(--ok)}#dot.running{background:var(--warn);animation:p 1s infinite}#dot.error{background:var(--err)}
@keyframes p{50%{opacity:.35}}
#state{color:var(--mute);font-size:.8rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:none;border:0;color:var(--fg);font-size:1.2rem;cursor:pointer;padding:.2rem .4rem;position:relative}
#badge{position:absolute;top:0;right:0;background:var(--err);color:#fff;border-radius:999px;font-size:.6rem;padding:0 .3rem;display:none}
main{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.55rem;max-width:760px;width:100%;margin:0 auto}
.msg{max-width:86%;padding:.55rem .8rem;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.me{align-self:flex-end;background:var(--me);color:var(--me-fg);border-bottom-right-radius:5px}
.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.ai pre{background:var(--chip);padding:.5rem;border-radius:8px;overflow-x:auto;white-space:pre}
.ai code{background:var(--chip);padding:0 .25rem;border-radius:4px;font-size:.9em}
.ai a{color:var(--me)}
.from{font-size:.75rem;color:var(--mute);margin:-.2rem .3rem -.35rem}.from.r{align-self:flex-end}.from.l{align-self:flex-start}
.chip{align-self:center;background:var(--chip);color:var(--mute);font-size:.78rem;padding:.2rem .7rem;border-radius:999px;max-width:92%;text-align:center}
.tool{align-self:flex-start;font-size:.78rem;color:var(--mute);padding:0 .4rem;cursor:pointer;max-width:92%}
.tool pre{white-space:pre-wrap;margin:.3rem 0 0;font-size:.75rem;background:var(--chip);padding:.4rem;border-radius:6px;display:none;max-height:40vh;overflow:auto}
.tool.open pre{display:block}.tool .x{color:var(--err)}
.card{align-self:stretch;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:10px;padding:.55rem .8rem}
.card b{display:block}.card small{color:var(--mute)}.card.ask{border-left-color:var(--me)}.card.done{opacity:.6}
.card pre{white-space:pre-wrap;font-size:.78rem;background:var(--chip);padding:.4rem;border-radius:6px;max-height:30vh;overflow:auto;margin:.4rem 0}
.btn{border:0;border-radius:8px;padding:.35rem .9rem;font:inherit;font-size:.9rem;cursor:pointer;background:var(--me);color:#fff;margin:.2rem .4rem .2rem 0}
.btn.gray{background:var(--chip);color:var(--fg)}.btn.red{background:var(--err)}
.err{color:var(--err);font-size:.8rem;align-self:flex-start}
.typing{align-self:flex-start;color:var(--mute);font-size:.85rem}
footer{border-top:1px solid var(--line);padding:.6rem;background:var(--bg);padding-bottom:max(.6rem,env(safe-area-inset-bottom))}
footer form{display:flex;gap:.5rem;max-width:760px;margin:0 auto}
textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:.55rem .75rem;font:inherit;max-height:40vh}
footer button{border:0;background:var(--me);color:#fff;border-radius:12px;padding:0 1rem;font-size:1rem;cursor:pointer}
footer button.stop{background:var(--err)}
#drawer{position:fixed;inset:0 0 0 auto;width:min(420px,94vw);background:var(--bg);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s;z-index:5;overflow-y:auto;padding:0 1rem 2rem}
#drawer.open{transform:none;box-shadow:-8px 0 24px #0002}
#tabs{display:flex;gap:.2rem;position:sticky;top:0;background:var(--bg);padding:.7rem 0 .5rem;border-bottom:1px solid var(--line);z-index:1}
#tabs button{border:0;background:none;color:var(--mute);font:inherit;font-size:.88rem;padding:.25rem .55rem;border-radius:8px;cursor:pointer}
#tabs button.on{background:var(--chip);color:var(--fg)}#tabs .close{margin-left:auto;font-size:1.1rem}
#drawer h2{font-size:.85rem;color:var(--mute);margin:1.1rem 0 .4rem;font-weight:600}
.row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.55rem .7rem;margin:.35rem 0;font-size:.86rem}
.row .t{font-weight:600}.row small{color:var(--mute)}.row .right{float:right}
.caps{margin-top:.25rem}.caps span{display:inline-block;font-size:.7rem;padding:0 .35rem;margin:.1rem;border-radius:4px;background:var(--chip);color:var(--mute)}.caps span.on{color:var(--ok)}
label{display:block;font-size:.82rem;color:var(--mute);margin:.5rem 0 .15rem}
input[type=text],input[type=password],input[type=url],select.f{width:100%;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:.45rem .6rem;font:inherit}
.check{display:flex;gap:.4rem;align-items:center;color:var(--fg);font-size:.85rem;margin:.2rem 0}
code.k{background:var(--chip);padding:.15rem .4rem;border-radius:5px;word-break:break-all;font-size:.85rem}
.muted{color:var(--mute);font-size:.82rem}
</style>
</head>
<body>
<header>
  <span id="dot"></span><h1 id="title">Ash</h1><select id="agents" hidden></select>
  <span id="state">连接中…</span>
  <button id="menu" title="设备与设置">☰<span id="badge"></span></button>
</header>
<main id="log"></main>
<footer><form id="f"><textarea id="t" rows="1" placeholder="跟 Ash 说点什么…"></textarea><button id="send">发送</button></form></footer>
<aside id="drawer"><div id="tabs"></div><div id="panel"></div></aside>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const logEl = $("#log"), panel = $("#panel");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const md = (s) => esc(s)
  .replace(/```[a-z0-9_-]*\n?([\s\S]*?)```/g, (_, c) => "<pre>" + c + "</pre>")
  .replace(/`([^`\n]+)`/g, "<code>$1</code>")
  .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
  .replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
const time = (ms) => new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const when = (ms) => new Date(ms).toLocaleString([], { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
const api = async (m, p, b) => {
  const r = await fetch("api/" + p, { method: m, headers: b ? { "content-type": "application/json" } : {}, body: b ? JSON.stringify(b) : undefined, credentials: "same-origin" });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.message || j.error || r.status);
  return j;
};

let M = null;            // manifest
let AGENT = null;        // selected agent id
let lastSeq = 0, typing = null, tab = "devices";
const status = {};       // agent id → status
const answered = new Set();
const bottom = () => logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 80;
const add = (el) => { const b = bottom(); logEl.appendChild(el); if (b) logEl.scrollTop = logEl.scrollHeight; return el; };
const node = (cls, html) => { const d = document.createElement("div"); d.className = cls; d.innerHTML = html; return d; };
const nameOf = (id) => (M?.members || []).find((m) => m.id === id)?.name || id;
const isMine = (e) => {
  // Events belonging to the selected agent's conversation.
  const d = e.data || {};
  if (e.type === "message.delivered") return d.to === AGENT;
  if (e.type.startsWith("agent.")) return e.member === AGENT;
  if (e.type.startsWith("timer.")) return (d.timer?.owner || "") === AGENT || e.member === AGENT;
  if (e.type === "notify" || e.type.startsWith("call.") || e.type.startsWith("confirm.")) return e.member === AGENT || (d.confirmation?.asker === AGENT);
  return false;
};

function setTyping(on) {
  if (on && !typing) typing = add(node("typing", "…思考中"));
  if (!on && typing) { typing.remove(); typing = null; }
}

function render(e, live) {
  const d = e.data || {};
  if (e.type === "agent.status") {
    status[e.member] = d.status;
    if (e.member === AGENT) { head(); setTyping(d.status === "running"); }
    return;
  }
  if (e.type === "confirm.requested") return confirmCard(d.confirmation, live);
  if (e.type === "confirm.answered") { answered.add(d.confirmation.id); const c = document.getElementById("c_" + d.confirmation.id); if (c) c.replaceWith(confirmDone(d.confirmation)); badge(); return; }
  if (e.type === "device.changed" || e.type === "grant.changed" || e.type === "member.changed") { if (live) refresh(); return; }
  if (!isMine(e)) return;
  const typingWas = typing; if (typingWas) setTyping(false);
  switch (e.type) {
    case "message.delivered": {
      const own = d.from === "person:owner" || d.from === M?.me;
      if (!own) add(node("from " + (d.from.startsWith("device:") ? "r" : "l"), esc(d.origin || nameOf(d.from)) + " · " + time(e.ts)));
      add(node("msg " + (d.from.startsWith("timer:") || d.from.startsWith("agent:") ? "ai" : "me"), md(d.text)));
      break;
    }
    case "agent.text": add(node("msg ai", md(d.text))); break;
    case "agent.tool.call": {
      const t = add(node("tool", "🔧 " + esc(d.name) + ' <span class="st"></span><pre>' + esc(JSON.stringify(d.args, null, 1)) + "</pre>"));
      t.dataset.name = d.name; t.onclick = () => t.classList.toggle("open"); break;
    }
    case "agent.tool.result": {
      const rows = [...logEl.querySelectorAll(".tool")].reverse();
      const t = rows.find((r) => r.dataset.name === d.name && !r.dataset.done);
      if (t) { t.dataset.done = "1"; t.querySelector(".st").innerHTML = d.ok ? "✓" : '<span class="x">✗</span>'; t.querySelector("pre").textContent += "\n→ " + (d.preview || ""); }
      break;
    }
    case "agent.turn.ended":
      if (d.reason === "error") add(node("err", "出错了：" + esc(d.error)));
      else if (d.reason === "cancelled") add(node("chip", "已停止"));
      else if (d.reason === "blocked") add(node("chip", "ash 停止了这一轮：" + esc(d.error || "")));
      break;
    case "timer.set": add(node("chip", "⏰ 已设提醒 · " + esc(d.timer.text.slice(0, 40)) + " · " + when(d.timer.fire_at))); break;
    case "timer.fired": add(node("chip", "⏰ 提醒到点 · " + esc(d.timer.text.slice(0, 40)))); break;
    case "timer.cancelled": add(node("chip", "⏰ 提醒已取消")); break;
    case "notify": add(node("card", "<b>🔔 " + esc(d.title) + "</b>" + md(d.text) + "<small>" + esc(nameOf(e.member)) + " · " + time(e.ts) + (d.quiet ? " · 静默时段" : "") + "</small>")); break;
    // An agent's device calls already show as its tool rows; list only calls made directly (e.g. by the owner).
    case "call.started": { if (String(d.caller || "").startsWith("agent:")) break; const c = add(node("tool", "🔌 " + esc(nameOf(d.device)) + " · " + esc(d.capability) + ' <span class="st">…</span>')); c.id = "call_" + d.id; break; }
    case "call.ended": { const c = document.getElementById("call_" + d.id); if (c) c.querySelector(".st").innerHTML = d.ok ? "✓" : '<span class="x">✗ ' + esc(d.error || "") + "</span>"; break; }
  }
  if (typingWas && status[AGENT] === "running") setTyping(true);
}

function confirmCard(c, live) {
  if (answered.has(c.id) || document.getElementById("c_" + c.id)) return;
  if (!live && c.expires_at < Date.now()) return;
  const el = node("card ask", "<b>🛡️ " + esc(c.title) + "</b>" + (c.detail ? "<pre>" + esc(c.detail) + "</pre>" : "") +
    "<small>" + esc(nameOf(c.asker)) + " 请你确认 · " + time(c.created_at) + "</small><div>" +
    (M?.caller?.owner ? '<button class="btn">允许</button><button class="btn gray">拒绝</button>' : '<span class="muted">请在手机上确认</span>') + "</div>");
  el.id = "c_" + c.id;
  const [yes, no] = el.querySelectorAll("button");
  const answer = async (approve) => { try { await api("POST", "confirms/" + encodeURIComponent(c.id), { approve }); } catch (err) { alert(err.message); } };
  if (yes) { yes.onclick = () => answer(true); no.onclick = () => answer(false); }
  add(el); badge();
}
function confirmDone(c) {
  const label = { approved: "已允许", denied: "已拒绝", expired: "已过期", cancelled: "已取消" }[c.state] || c.state;
  return node("card ask done", "<b>🛡️ " + esc(c.title) + "</b><small>" + label + "</small>");
}
function badge() {
  const n = logEl.querySelectorAll(".card.ask:not(.done)").length;
  const b = $("#badge"); b.textContent = n; b.style.display = n ? "inline" : "none";
}

function head() {
  const a = (M?.agents || []).find((x) => x.id === AGENT);
  const s = status[AGENT] || a?.status || "starting";
  $("#dot").className = s;
  const label = { idle: "在线", running: "思考中…", starting: "启动中…", error: "出错", stopped: "已停止" }[s] || s;
  $("#state").textContent = label + (a?.model ? " · " + a.model : "") + (M && !M.caller.local ? " · 远程" : "");
  $("#send").textContent = s === "running" ? "停止" : "发送";
  $("#send").className = s === "running" ? "stop" : "";
}

async function refresh() {
  M = await api("GET", "manifest");
  const sel = $("#agents");
  if (!AGENT || !M.agents.some((a) => a.id === AGENT)) AGENT = localStorage.getItem("ash.agent") || M.agents[0]?.id;
  if (!M.agents.some((a) => a.id === AGENT)) AGENT = M.agents[0]?.id;
  for (const a of M.agents) status[a.id] ??= a.status;
  if (M.agents.length > 1) {
    sel.hidden = false; $("#title").hidden = true;
    sel.innerHTML = M.agents.map((a) => '<option value="' + esc(a.id) + '"' + (a.id === AGENT ? " selected" : "") + ">" + esc(a.name) + "</option>").join("");
  } else $("#title").textContent = M.agents[0]?.name || "Ash";
  document.title = nameOf(AGENT) || "Ash";
  $("#t").placeholder = "跟 " + (nameOf(AGENT) || "Ash") + " 说点什么…";
  head();
  if ($("#drawer").classList.contains("open")) showTab(tab);
}

let source = null;
async function history() {
  logEl.innerHTML = ""; typing = null;
  // The last 300 events are enough for the screen; older ones stay in the log.
  const start = Math.max(0, (M.lastSeq || 0) - 300);
  let after = start;
  for (;;) {
    const page = await api("GET", "events?after=" + after + "&limit=500");
    for (const e of page.events) { render(e, false); lastSeq = e.seq; }
    if (page.events.length < 500) break;
    after = page.next;
  }
  for (const c of await api("GET", "confirms").catch(() => [])) confirmCard(c, true);
  logEl.scrollTop = logEl.scrollHeight;
  follow();
}
function follow() {
  source?.close();
  source = new EventSource("api/events/stream?after=" + lastSeq, { withCredentials: true });
  source.onmessage = (m) => { const e = JSON.parse(m.data); if (e.seq <= lastSeq) return; lastSeq = e.seq; render(e, true); };
  source.onopen = () => head();
  source.onerror = () => { $("#state").textContent = "重连中…"; };
}

// ------------------------------------------------------------------ composer
const t = $("#t");
t.addEventListener("input", () => { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; });
t.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing && matchMedia("(pointer:fine)").matches) { e.preventDefault(); $("#f").requestSubmit(); } });
$("#f").onsubmit = async (e) => {
  e.preventDefault();
  const text = t.value.trim();
  if (!text) { if (status[AGENT] === "running") await api("POST", "agents/" + encodeURIComponent(AGENT) + "/cancel", {}).catch((err) => alert(err.message)); return; }
  t.value = ""; t.style.height = "auto";
  try { await api("POST", "agents/" + encodeURIComponent(AGENT) + "/deliver", { text, mode: status[AGENT] === "running" ? "steer" : "queue" }); }
  catch (err) { add(node("err", "发送失败：" + esc(err.message))); t.value = text; }
};
$("#agents").onchange = (e) => { AGENT = e.target.value; localStorage.setItem("ash.agent", AGENT); refresh().then(history); };

// ------------------------------------------------------------------ drawer
const TABS = () => [["devices", "设备"], ["grants", "权限"], ["timers", "提醒"], ...(M?.caller?.manage ? [["settings", "设置"]] : [])];
$("#menu").onclick = () => { $("#drawer").classList.toggle("open"); if ($("#drawer").classList.contains("open")) showTab(tab); };
function tabs() {
  $("#tabs").innerHTML = TABS().map(([k, v]) => '<button data-k="' + k + '" class="' + (k === tab ? "on" : "") + '">' + v + "</button>").join("") + '<button class="close" data-k="x">✕</button>';
  $("#tabs").querySelectorAll("button").forEach((b) => (b.onclick = () => (b.dataset.k === "x" ? $("#drawer").classList.remove("open") : showTab(b.dataset.k))));
}
async function showTab(k) {
  tab = k; tabs();
  try { panel.innerHTML = await ({ devices: devicesTab, grants: grantsTab, timers: timersTab, settings: settingsTab }[k] || devicesTab)(); bind(); }
  catch (err) { panel.innerHTML = '<p class="err">' + esc(err.message) + "</p>"; }
}
let bindings = [];
const on = (id, fn) => bindings.push([id, fn]);
function bind() { for (const [id, fn] of bindings) { const el = document.getElementById(id); if (el) el.onclick = fn; } bindings = []; }

async function devicesTab() {
  const devices = await api("GET", "devices");
  let h = "<h2>设备</h2>";
  for (const d of devices) {
    h += '<div class="row"><span class="t">' + (d.online ? "🟢 " : "⚪️ ") + esc(d.name) + '</span> <small>' + esc({ phone: "本机", laptop: "电脑", browser: "浏览器", other: "设备" }[d.kind] || d.kind) + (d.via === "gateway" ? " · 经网关" : "") + "</small>" +
      (M.caller.manage && d.via === "gateway" ? '<button class="btn red right" id="rv_' + esc(d.id) + '">撤销</button>' : "") +
      '<div class="caps">' + (d.capabilities.map((c) => '<span class="' + (d.online ? "on" : "") + '" title="' + esc(c.description) + '">' + esc(c.name) + (c.confirm ? " 🛡️" : "") + "</span>").join("") || '<span>无可用能力</span>') + "</div></div>";
    if (M.caller.manage && d.via === "gateway") on("rv_" + d.id, async () => { if (confirm("撤销 " + d.name + "？它将立即断开，需要重新配对。")) { await api("POST", "gateway/revoke", { device: d.id }); showTab("devices"); } });
  }
  if (!M.caller.manage) return h + '<p class="muted">配对和撤销设备请在手机上操作。</p>';
  const g = await api("GET", "gateway");
  h += "<h2>网关</h2>";
  if (!g.configured) return h + '<p class="muted">还没有连接网关。到「设置」里填写网关地址。</p>';
  h += '<div class="row">' + (g.connected ? "🟢 已连接" : "🔴 未连接" + (g.error ? " · " + esc(g.error) : "")) + '<br><small>' + esc(g.gateway) + "</small><br><small>手机指纹 " + esc(g.fingerprint) + "</small></div>";
  h += '<h2>添加设备</h2><div class="row"><button class="btn" id="ticket">生成配对码</button><div id="tk"></div></div>';
  on("ticket", async () => { const r = await api("POST", "gateway/ticket", {}); document.getElementById("tk").innerHTML = '<p class="muted">在新设备上打开 <code class="k">' + esc(r.gateway) + "</code> 粘贴配对码（5 分钟内有效）；电脑上用 <code class=\"k\">ash-core --pair</code>：</p><code class=\"k\">" + esc(r.ticket) + "</code>"; });
  if (g.pending?.length) {
    h += "<h2>待确认</h2>";
    for (const p of g.pending) {
      h += '<div class="row"><span class="t">' + esc(p.name) + '</span><br><small>设备指纹 ' + esc(p.fingerprint) + "（和新设备上显示的一致才批准）</small>" +
        '<label class="check"><input type="checkbox" id="w_' + p.request_id + '" checked> 完整界面（我自己的浏览器）</label>' +
        '<label class="check"><input type="checkbox" id="x_' + p.request_id + '"> 开放本机能力给 Agent（电脑）</label>' +
        '<label class="check"><input type="checkbox" id="s_' + p.request_id + '"> 可以请求敏感操作（由我确认）</label>' +
        '<button class="btn" id="ok_' + p.request_id + '">批准</button><button class="btn gray" id="no_' + p.request_id + '">拒绝</button></div>';
      on("ok_" + p.request_id, async () => {
        const perms = ["chat"];
        if (document.getElementById("w_" + p.request_id).checked) perms.push("web_ui");
        if (document.getElementById("x_" + p.request_id).checked) perms.push("expose_capability");
        if (document.getElementById("s_" + p.request_id).checked) perms.push("request_sensitive_action");
        await api("POST", "gateway/approve", { request_id: p.request_id, permissions: perms }); showTab("devices");
      });
      on("no_" + p.request_id, async () => { await api("POST", "gateway/reject", { request_id: p.request_id }); showTab("devices"); });
    }
  }
  return h;
}

async function grantsTab() {
  const grants = await api("GET", "grants");
  let h = "";
  for (const a of M.agents) {
    h += "<h2>" + esc(a.name) + " 可以使用</h2>";
    const mine = grants.filter((g) => g.member === a.id);
    h += mine.map((g) => '<div class="row">' + esc(g.scope === "*" ? "所有设备的所有能力" : g.scope) + (M.caller.manage ? '<button class="btn gray right" id="g_' + g.id + '">收回</button>' : "") + "</div>").join("") || '<p class="muted">没有授权</p>';
    for (const g of mine) on("g_" + g.id, async () => { await api("DELETE", "grants/" + encodeURIComponent(g.id)); showTab("grants"); });
    if (M.caller.manage) {
      h += '<div class="row"><select class="f" id="gs_' + esc(a.id) + '"><option value="*">所有设备</option>' + M.devices.map((d) => '<option value="' + esc(d.id) + '/*">' + esc(d.name) + "</option>").join("") + '</select><button class="btn" id="ga_' + esc(a.id) + '">授权</button></div>';
      on("ga_" + a.id, async () => { await api("POST", "grants", { member: a.id, scope: document.getElementById("gs_" + a.id).value }); showTab("grants"); });
    }
  }
  return h + '<p class="muted">🛡️ 标记的能力每次都会先问你。来自不受信任来源的请求，敏感操作也会先问你。</p>';
}

async function timersTab() {
  const timers = await api("GET", "timers");
  let h = "<h2>提醒</h2>";
  h += timers.map((x) => '<div class="row"><span class="t">' + when(x.fire_at) + "</span>" + (x.repeat_seconds ? " <small>每 " + Math.round(x.repeat_seconds / 60) + " 分钟</small>" : "") + '<button class="btn gray right" id="tc_' + x.id + '">取消</button><br><small>' + esc(nameOf(x.owner)) + "</small> " + esc(x.text.slice(0, 160)) + "</div>").join("") || '<p class="muted">没有提醒</p>';
  for (const x of timers) on("tc_" + x.id, async () => { await api("DELETE", "timers/" + encodeURIComponent(x.id)); showTab("timers"); });
  return h;
}

async function settingsTab() {
  const s = await api("GET", "settings");
  const g = await api("GET", "gateway");
  let h = "<h2>模型</h2>";
  if (s.models?.length) {
    h += '<select class="f" id="model">' + s.models.map((m) => '<option value="' + esc(m.provider + "|" + m.id) + '"' + (s.model && s.model.provider === m.provider && s.model.model === m.id ? " selected" : "") + ">" + esc(m.name) + " · " + esc(m.provider) + "</option>").join("") + "</select>";
  } else h += '<p class="muted">' + esc(s.model ? s.model.provider + "/" + s.model.model : "未知") + "</p>";
  h += "<h2>密钥</h2>";
  for (const [k, v] of Object.entries(s.credentials || {})) h += '<label>' + esc(k) + (v ? " · 已设置" : " · 未设置") + '</label><input type="password" id="k_' + k + '" placeholder="' + (v ? "••••••（留空不改）" : "粘贴密钥") + '" autocomplete="off">';
  h += '<button class="btn" id="save">保存</button><span id="saved" class="muted"></span>';
  on("save", async () => {
    const creds = {};
    for (const k of Object.keys(s.credentials || {})) { const v = document.getElementById("k_" + k).value.trim(); if (v) creds[k] = v; }
    const sel = document.getElementById("model");
    const [provider, model] = sel ? sel.value.split("|") : [];
    await api("POST", "settings", { credentials: creds, ...(provider ? { model: { provider, model } } : {}) });
    document.getElementById("saved").textContent = " 已保存"; setTimeout(refresh, 300);
  });
  h += "<h2>网关</h2>";
  h += '<label>网关地址</label><input type="url" id="gw" value="' + esc(g.gateway || "") + '" placeholder="https://ash-gateway.xxx.workers.dev">';
  h += '<label>BOOTSTRAP_SECRET（只在第一次认领时需要）</label><input type="password" id="gws" autocomplete="off">';
  h += '<button class="btn" id="gwsave">连接</button><p class="muted">网关是你自己部署在 Cloudflare 上的中转站（开源：wanpengxie/ash-gateway）。手机认领后，你的浏览器和电脑配对即可远程使用 Ash。</p>';
  on("gwsave", async () => { await api("POST", "gateway/configure", { url: document.getElementById("gw").value.trim(), secret: document.getElementById("gws").value }); showTab("devices"); });
  if (navigator.userAgent.includes("AshApp")) h += '<h2>手机</h2><p><a class="btn gray" href="ash://console">诊断、权限与日志</a></p>';
  h += '<h2>关于</h2><p class="muted">ash · DSH ' + esc(s.dsh || "") + " · 空间 " + esc(M.space) + "</p>";
  return h;
}

// ------------------------------------------------------------------ start
(async () => {
  try {
    await refresh();
    await history();
  } catch (err) {
    $("#state").textContent = "连接失败：" + err.message;
  }
})();
</script>
</body>
</html>
