<!doctype html>
<html lang="zh">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">

<title>Ash</title>
<!--
  The app shell is bundled into this page at build time. It uses the same
  documented HTTP and event-stream routes locally and through a paired gateway.
-->
<style>
:root{--seg:#fff;--bg:#f7f7f5;--fg:#1c1c1e;--mute:#8a8a8e;--line:#e6e6e3;--me:#2f6bff;--me-fg:#fff;--card:#fff;--chip:#efefec;--err:#d33;--ok:#2bb673;--warn:#f5a623}
@media (prefers-color-scheme:dark){:root{--seg:#3a3a3d;--bg:#141415;--fg:#ececee;--mute:#8d8d93;--line:#2a2a2d;--me:#3b74ff;--card:#1e1e20;--chip:#242427;--err:#ff6b6b}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,system-ui,"PingFang SC","Noto Sans SC",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:.6rem;padding:.65rem 1rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
header h1{font-size:1.05rem;margin:0;font-weight:650;letter-spacing:.02em}
header select{border:0;background:none;color:var(--fg);font:inherit;font-weight:650;font-size:1.05rem;padding:0;max-width:40vw}
#presence{display:flex;align-items:center;gap:.65rem;min-width:0;text-align:left;max-width:55%;padding:0;border:0;background:none;color:var(--fg);cursor:pointer}
#presence:focus-visible{outline:2px solid var(--me);outline-offset:4px;border-radius:8px}
#identity{display:flex;flex-direction:column;min-width:0}
#title{font-size:1.05rem;font-weight:650;line-height:1.25}
#connection{font-size:.72rem;color:var(--mute);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#presenceNotice{position:absolute;top:100%;left:1rem;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.3rem .6rem;font-size:.75rem;color:var(--mute)}
#presenceNotice:empty{display:none}
#face{position:relative;flex:none;width:40px;height:40px}
.face{display:block;width:100%;height:100%;border-radius:12px;background:var(--chip);object-fit:contain}
#dot{position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border:2px solid var(--bg);border-radius:50%;background:var(--mute)}#dot.idle{background:var(--ok)}#dot.running{background:var(--warn);animation:p 1s infinite}#dot.error{background:var(--err)}
@keyframes p{50%{opacity:.35}}
#state{color:var(--mute);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:none;border:0;color:var(--fg);font-size:1.2rem;cursor:pointer;padding:.2rem .4rem;position:relative}
#badge{position:absolute;top:0;right:0;background:var(--err);color:#fff;border-radius:999px;font-size:.6rem;padding:0 .3rem;display:none}
main{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.55rem;max-width:760px;width:100%;margin:0 auto}
.msg{max-width:86%;padding:.55rem .8rem;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.me{align-self:flex-end;background:var(--me);color:var(--me-fg);border-bottom-right-radius:5px}
.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.ai pre{background:var(--chip);padding:.5rem;border-radius:8px;overflow-x:auto;white-space:pre}
.ai code{background:var(--chip);padding:0 .25rem;border-radius:4px;font-size:.9em}
.ai a{color:var(--me)}
.from{font-size:.75rem;color:var(--mute);margin:-.2rem .3rem -.35rem}.from.r{align-self:flex-end}.from.l{align-self:flex-start}
.delivery{align-self:flex-end;color:var(--mute);font-size:.72rem;margin:-.4rem .3rem .15rem}
.msg.ai.group-first{border-bottom-left-radius:5px}.msg.ai.group-middle{border-top-left-radius:5px;border-bottom-left-radius:5px}.msg.ai.group-last{border-top-left-radius:5px}
.reactions{display:flex;gap:.25rem;margin-top:.3rem}.reaction{background:var(--chip);border-radius:999px;padding:.05rem .35rem;font-size:.82rem}
.attachment{display:inline-block;border:0;border-radius:7px;background:var(--chip);color:var(--fg);padding:.15rem .45rem;font:inherit;font-size:.8rem;text-decoration:none;cursor:pointer;max-width:100%;overflow-wrap:anywhere}
.chip{align-self:center;background:var(--chip);color:var(--mute);font-size:.78rem;padding:.2rem .7rem;border-radius:999px;max-width:92%;text-align:center}
.tool{align-self:flex-start;font-size:.78rem;color:var(--mute);padding:0 .4rem;cursor:pointer;max-width:92%}
.tool pre{white-space:pre-wrap;margin:.3rem 0 0;font-size:.75rem;background:var(--chip);padding:.4rem;border-radius:6px;display:none;max-height:40vh;overflow:auto}
.tool.open pre{display:block}.tool .x{color:var(--err)}
.card{align-self:stretch;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:10px;padding:.55rem .8rem}
.card b{display:block}.card small{color:var(--mute)}.card.ask .ask-title{font-weight:600;margin-bottom:.25rem}.card.ask .ask-detail,.card.ask .ask-outcome{display:block;line-height:1.5}.card.ask .ask-outcome{margin-top:.3rem}.card.ask .ask-actions{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.6rem}.card.ask{border-left-color:var(--me)}.card.done{opacity:.6}
.card-image{display:block;max-width:100%;max-height:50vh;object-fit:contain;margin-top:.4rem;border-radius:8px}
.card-custom{width:min(18rem,100%);padding:.35rem .5rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
.card pre{white-space:pre-wrap;font-size:.78rem;background:var(--chip);padding:.4rem;border-radius:6px;max-height:30vh;overflow:auto;margin:.4rem 0}
.btn{border:0;border-radius:8px;padding:.35rem .9rem;font:inherit;font-size:.9rem;cursor:pointer;background:var(--me);color:#fff;margin:.2rem .4rem .2rem 0}
.btn.gray{background:var(--chip);color:var(--fg)}.btn.red{background:var(--err)}
.err{color:var(--err);font-size:.8rem;align-self:flex-start}
.typing{align-self:flex-start;color:var(--mute);font-size:.85rem;display:flex;align-items:center;gap:.5rem}.typing .face{width:32px;height:32px;border-radius:10px}
.hello{margin:auto;text-align:center;color:var(--mute);font-size:.9rem}.hello .face{width:132px;height:132px;border-radius:32px;margin:0 auto .6rem}
footer{border-top:1px solid var(--line);padding:.6rem;background:var(--bg);padding-bottom:max(.6rem,env(safe-area-inset-bottom))}
footer form{display:flex;gap:.5rem;max-width:760px;margin:0 auto}
textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:.55rem .75rem;font:inherit;max-height:40vh}
footer button{border:0;background:var(--me);color:#fff;border-radius:12px;padding:0 1rem;font-size:1rem;cursor:pointer}
footer button.stop{background:var(--err)}
#attach{background:var(--chip);color:var(--fg);padding:0 .8rem;font-size:1.15rem}
.pending-note,#selected{display:block;color:var(--mute);font-size:.72rem;padding:.1rem .5rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pending{display:flex;gap:.4rem;flex-wrap:wrap;max-width:760px;margin:0 auto .4rem}#pending:empty{display:none}
.pa{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.25rem .5rem;font-size:.8rem;display:flex;align-items:center;gap:.3rem;max-width:12rem}
.pa img{width:3rem;height:3rem;object-fit:cover;border-radius:6px}.pa span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pa b{cursor:pointer;color:var(--mute);font-weight:400;padding-left:.2rem}
.atts{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.35rem}.atts img{max-width:14rem;max-height:14rem;border-radius:10px;display:block}
.atts a{font-size:.8rem;background:rgba(255,255,255,.18);border-radius:8px;padding:.15rem .5rem;color:inherit;text-decoration:none}
.ai .atts a{background:var(--chip)}
#drawer{position:fixed;inset:0 0 0 auto;width:min(420px,94vw);background:var(--bg);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s;z-index:5;overflow-y:auto;padding:0 1rem 2rem}
#drawer.open{transform:none;box-shadow:-8px 0 24px #0002}
#agentSheet{position:fixed;inset:0 0 0 auto;width:min(480px,100vw);background:var(--bg);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s;z-index:6;overflow-y:auto;padding:0 1rem calc(2.5rem + env(safe-area-inset-bottom))}
#agentSheet.open{transform:none;box-shadow:-8px 0 24px #0002}
#agentTopBar{position:sticky;top:0;z-index:3;display:flex;justify-content:flex-end;align-items:center;height:2.6rem;background:var(--bg)}
#agentClose{border:0;background:none;color:var(--me);font:inherit;font-size:.95rem;cursor:pointer;padding:.3rem 0}
#agentSheetHeader{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 0 1.1rem}
#agentAvatar{display:block;width:100px;height:100px;border-radius:30px;background:var(--chip);object-fit:contain}
#agentSheetHeader h2{font-size:1.5rem;font-weight:700;line-height:1.25;margin:.75rem 0 .15rem;max-width:100%;overflow-wrap:anywhere}
#agentState{display:flex;align-items:center;gap:.4rem;margin:0;max-width:100%;color:var(--mute);font-size:.88rem}
#agentState::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--mute)}
#agentState[data-dot=idle]::before{background:var(--ok)}#agentState[data-dot=running]::before{background:var(--warn);animation:p 1s infinite}#agentState[data-dot=error]::before{background:var(--err)}
#agentTabsBar{position:sticky;top:2.6rem;z-index:2;background:var(--bg);padding:.1rem 0 .5rem}
#agentTabs{display:flex;gap:2px;padding:3px;border-radius:11px;background:var(--chip)}
#agentTabs button{position:relative;flex:1;min-width:0;border:0;border-radius:8px;background:none;color:var(--mute);padding:.4rem 0;font:inherit;font-size:.88rem;cursor:pointer}
#agentTabs button[aria-selected=true]{background:var(--seg);color:var(--fg);font-weight:600;box-shadow:0 1px 3px #0000001f}
#agentTabs button[data-badge]:not([data-badge=""])::after{content:attr(data-badge);display:inline-block;vertical-align:.12em;margin-left:.2rem;min-width:1.05rem;height:1.05rem;padding:0 .28rem;border-radius:999px;background:var(--err);color:#fff;font-size:.66rem;font-weight:600;line-height:1.05rem;box-sizing:border-box}
#agentPanel>section>:first-child{margin-top:.5rem}
#agentSheet .btn{margin:0;padding:.5rem 1.1rem;border-radius:10px;font-size:.92rem}#agentSheet .btn:disabled{opacity:.45;cursor:default}
#agentSheet .set-actions{flex-wrap:wrap;gap:.5rem;align-items:center}
.sheet-loading,.sheet-empty{color:var(--mute);font-size:.88rem;margin:.6rem .9rem}
.sheet-empty.set-card{margin:.6rem 0}
.set-group .sheet-loading,.set-group .sheet-empty,.set-group .sheet-unavailable{margin:0;color:var(--mute);font-size:.88rem}
#agentPanel .sheet-note{margin:-.1rem .9rem .55rem;font-size:.8rem}
.sheet-retry-button{margin-top:.9rem}
#agentPanel .sheet-status{margin:.6rem .9rem 0}
.sheet-retry{display:flex;flex-direction:column;align-items:flex-start;gap:.6rem;margin:.6rem 0;padding:.9rem;border-radius:14px;background:var(--card);color:var(--fg);font-size:.9rem}
.sheet-retry p{margin:0}
.sheet-link{border:0;background:none;color:var(--me);font:inherit;font-size:.84rem;padding:.2rem 0;cursor:pointer}
.sheet-link:disabled{color:var(--mute);cursor:default}
.sheet-error,.editor-warning{color:var(--err);font-size:.82rem;margin:.1rem 0;line-height:1.45}
.activity-turn{background:var(--card);border-radius:14px;padding:.8rem .9rem .65rem;margin:.5rem 0}
.activity-head{display:flex;align-items:baseline;gap:.7rem}
.activity-turn h3{flex:1;min-width:0;margin:0;font-size:.97rem;font-weight:600;line-height:1.4;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.activity-time{flex:none;color:var(--mute);font-size:.78rem;font-variant-numeric:tabular-nums}
.activity-steps{list-style:none;margin:.45rem 0 0;padding:0}
.activity-step{position:relative;margin:0;padding:.1rem 0 .1rem 1.05rem;color:var(--mute);font-size:.84rem;line-height:1.45;overflow-wrap:anywhere}
.activity-step::before{content:"";position:absolute;left:.15rem;top:.6em;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.45}
.activity-step+.activity-step::after{content:"";position:absolute;left:calc(.15rem + 2.5px);top:-.45em;height:.85em;border-left:1px solid var(--line)}
.activity-step[data-state=pending]::before{background:none;border:1.5px solid var(--warn);opacity:1;width:7px;height:7px}
.activity-step[data-state=failed]::before,.activity-step[data-state=error]::before{background:var(--err);opacity:1}
.activity-step[hidden]{display:none}
.activity-step{padding-top:.45rem;padding-bottom:.55rem}
.activity-step-title{color:var(--fg);font-weight:500;line-height:1.55}
.activity-step-meta{font-size:.73rem;color:var(--mute);margin-top:.18rem}
.activity-detail{margin-top:.35rem;font-size:.76rem}
.activity-detail summary{cursor:pointer;color:var(--me)}
.activity-detail pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:45vh;overflow:auto;background:var(--chip);border-radius:8px;padding:.6rem;font-size:.73rem}
.activity-step[data-state=ok]::before{background:var(--ok);opacity:1}
.activity-foot{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-top:.55rem;padding-top:.5rem;border-top:1px solid var(--line)}
.activity-outcome{font-size:.8rem;color:var(--mute)}
.activity-outcome[data-outcome=completed]{color:var(--ok)}.activity-outcome[data-outcome=running]{color:var(--warn)}.activity-outcome[data-outcome=error]{color:var(--err)}
.activity-ask{border:0;background:none;color:var(--me);font:inherit;font-size:.8rem;padding:.15rem 0;cursor:pointer;white-space:nowrap}
.activity-more{border:0;background:none;color:var(--mute);font:inherit;font-size:.8rem;padding:.15rem 0 0 1.05rem;cursor:pointer}
button.activity-bg-toggle{display:flex;align-items:center;gap:.45rem;border:0;background:none;font:inherit;font-size:.8rem;font-weight:600;color:var(--mute);padding:0;cursor:pointer;text-align:left}
.activity-bg-toggle .set-chev{width:.42rem;height:.42rem;transition:transform .15s}.activity-bg-toggle[aria-expanded=true] .set-chev{transform:rotate(135deg)}
.activity-bg[hidden]{display:none}
.upcoming-timer{display:flex;align-items:center;gap:.85rem;padding:.75rem .9rem}
.upcoming-when{flex:none;min-width:3.1rem;font-size:1.12rem;font-weight:600;font-variant-numeric:tabular-nums}
.upcoming-cancel{flex:none;border:0;border-radius:8px;background:none;color:var(--err);font:inherit;font-size:.86rem;padding:.3rem .1rem;cursor:pointer}
.upcoming-cancel.armed{background:var(--err);color:#fff;padding:.3rem .65rem}
.upcoming-cancel:disabled{opacity:.5}
.sheet-approval h4{margin:0;font-size:.98rem;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.sheet-approval p{margin:0}
.approval-detail{color:var(--fg);font-size:.88rem;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.approval-original{margin:.6rem 0;text-align:left;min-width:0}
.approval-original summary{cursor:pointer;color:var(--mute);font-size:.85rem}
.approval-original-text{max-height:50vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;unicode-bidi:plaintext;font-size:.82rem;line-height:1.5;padding:.65rem;background:var(--chip);border-radius:8px}
.approval-expiry{color:var(--mute);font-size:.78rem}
#agentSheet .sheet-approval .btn{padding:.42rem .9rem;font-size:.88rem}#agentSheet .sheet-approval .btn.tint{background:color-mix(in srgb,var(--me) 14%,transparent);color:var(--me)}
.sheet-rule .btn,.sheet-rule .sheet-link{flex:none}
.sheet-rule .armed{color:var(--err)}
.sheet-history .sheet-link{flex:none;align-self:flex-start}
.sheet-evidence{display:flex;flex-direction:column;gap:.45rem;margin:.5rem 0 .2rem;padding:.65rem .75rem;border-radius:12px;background:var(--chip)}
.sheet-evidence-row{display:flex;flex-direction:column;gap:.1rem}
.sheet-evidence-label{font-size:.76rem;color:var(--mute)}
.sheet-evidence-value{font-size:.86rem;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.sheet-switch{display:flex;gap:.45rem;margin:.1rem 0 .7rem}
.sheet-switch button{border:0;border-radius:999px;background:var(--chip);color:var(--fg);padding:.35rem .95rem;font:inherit;font-size:.86rem;cursor:pointer}
.sheet-switch button.on,.sheet-switch button:disabled{background:var(--fg);color:var(--bg);cursor:default}
.doc-card{gap:.55rem}
.editor-version{color:var(--mute);font-size:.76rem;margin:0}.editor-version:empty{display:none}
.doc-body{font-size:.93rem;line-height:1.65;overflow-wrap:anywhere}
.doc-body>:first-child{margin-top:0}.doc-body>:last-child{margin-bottom:0}
.doc-body h4{font-size:1rem;font-weight:650;margin:.8rem 0 .25rem}.doc-body p{margin:.4rem 0}.doc-body ul{margin:.3rem 0;padding-left:1.15rem}.doc-body li{margin:.12rem 0}
.doc-empty{color:var(--mute)}
#agentPanel .markdown-source{display:block;width:100%;min-height:16rem;resize:vertical;margin:0;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);padding:.7rem .75rem;font:inherit;font-size:.92rem;line-height:1.6;max-height:none}
#agentPanel [hidden]{display:none}
.editor-status{color:var(--mute);font-size:.82rem;margin:0}.editor-status:empty{display:none}
.editor-snapshots .set-item{justify-content:space-between}
.sheet-rename{margin-top:1.2rem}
#progress{padding:.35rem 1rem;border-top:1px solid var(--line);background:var(--bg)}#progress[hidden]{display:none}.progress-button{display:block;width:min(760px,100%);margin:auto;padding:.2rem .4rem;border:0;background:transparent;color:var(--mute);font:inherit;font-size:.8rem;text-align:left;cursor:pointer}
.suggestion{display:flex;align-items:center;gap:.4rem;max-width:760px;margin:0 auto .4rem;padding:.35rem .55rem;border-radius:9px;background:var(--chip);font-size:.82rem}.suggestion span{flex:1}.suggestion button{border:0;background:var(--card);color:var(--fg);border-radius:6px;padding:.2rem .5rem;font:inherit;cursor:pointer}
#context{padding:.35rem 1rem;background:var(--bg)}#context[hidden]{display:none}.context-chip{display:flex;align-items:center;gap:.4rem;max-width:760px;margin:auto;color:var(--mute);font-size:.78rem}.context-chip button{border:0;background:var(--chip);color:var(--fg);border-radius:6px;padding:.1rem .4rem;cursor:pointer}
#tabs{display:flex;gap:.2rem;position:sticky;top:0;background:var(--bg);padding:.7rem 0 .5rem;border-bottom:1px solid var(--line);z-index:1}
#tabs button{border:0;background:none;color:var(--mute);font:inherit;font-size:.88rem;padding:.25rem .55rem;border-radius:8px;cursor:pointer}
#tabs button.on{background:var(--chip);color:var(--fg)}#tabs .close{margin-left:auto;font-size:1.1rem}
#drawer h2{font-size:.85rem;color:var(--mute);margin:1.1rem 0 .4rem;font-weight:600}
#tabs:empty{display:none}
.set-titlebar{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);padding:1rem 0 .4rem;z-index:2}
.set-titlebar[hidden]{display:none}
#drawer h2.set-main-title{font-size:1.5rem;font-weight:700;color:var(--fg);margin:0}
.set-close,.set-back{border:0;background:none;color:var(--me);font:inherit;font-size:.95rem;cursor:pointer;padding:.3rem 0}
.set-back{padding:1rem 0 .2rem;display:flex;align-items:center;gap:.2rem}.set-back::before{content:"";width:.5rem;height:.5rem;border:solid currentColor;border-width:0 0 2px 2px;transform:rotate(45deg);margin-right:.15rem}
#drawer h2.set-page-title{font-size:1.4rem;font-weight:700;color:var(--fg);margin:.2rem 0 .3rem}
.set-page[hidden],#settingsHome[hidden]{display:none}
.set-intro{color:var(--mute);font-size:.86rem;margin:.2rem 0 .9rem;line-height:1.5}
.set-header{font-size:.8rem;font-weight:600;color:var(--mute);margin:1.3rem .9rem .45rem}

.set-row{display:flex;align-items:center;gap:.8rem;width:100%;padding:.8rem .9rem;border:0;background:none;color:var(--fg);font:inherit;text-align:left;text-decoration:none;cursor:pointer}

.set-text{display:flex;flex-direction:column;flex:1;min-width:0}
.set-title{font-size:.97rem;font-weight:500;line-height:1.35}
.set-sub{font-size:.8rem;color:var(--mute);line-height:1.4;overflow-wrap:anywhere}
.set-sub.warn,.set-status.warn{color:var(--warn)}.set-status.ok{color:var(--ok)}

.set-item{display:flex;align-items:center;gap:.5rem;padding:.7rem .9rem}.set-item .btn{margin:0;flex:none}
.set-range{flex-direction:row;align-items:center;gap:.6rem}

.set-editor{display:block;width:100%;min-height:14rem;border:0;border-radius:14px;background:var(--card);color:var(--fg);padding:.9rem;font:inherit;line-height:1.55;margin:0 0 .5rem;resize:vertical}

    if (signal?.aborted) { reject(new DOMException("Aborted", "AbortError")); return result; }
    signal?.addEventListener("abort", abort, { once: true });
    pending.set(id, {
      finish() { pending.delete(id); signal?.removeEventListener("abort", abort); },
      started() {
        if (!live) return;
        resolve(new Response(new ReadableStream({ start(value) { controller = value; } }),
          { status: 200, headers: { "content-type": "text/event-stream" } }));
      },
      chunk(value) { controller?.enqueue(decode(value)); },
      done(message) {
        this.finish();
        if (live) controller?.close();
        else resolve(new Response([204, 205, 304].includes(message.status) ? null : decode(message.body), { status: message.status,
          headers: { "content-type": message.content_type || "application/octet-stream" } }));
      },
      error() { this.finish(); const error = new Error("core request unavailable"); controller?.error(error); reject(error); },
    });
    post({ type: "request", id, operation, path, method: options.method || "GET",
      headers: Object.fromEntries(new Headers(options.headers || {}).entries()), body: options.body || null });
    return result;
  }

  native.onmessage = (event) => {
    let message;
    try { message = JSON.parse(event.data); } catch { return; }
    if (message.type === "ready" && !ready) {
      ready = true;
      globalThis.__ashNativeBoot(request, message.endpoint);
      return;
    }
    const item = pending.get(message.id);
    if (!item) return;
    if (item.browserLogins) {
      if (message.type === "browser_logins_result") { item.finish(); item.resolve({ ok: message.ok === true }); }
      return;
    }
    if (item.gatewayConfig) {
      if (message.type === "gateway_config_result") { item.finish(); item.resolve({ ok: message.ok === true,
        configured: message.configured === true, url: typeof message.url === "string" ? message.url : "" }); }
      return;
    }
    if (message.type === "started") item.started();
    else if (message.type === "chunk") item.chunk(message.body);
    else if (message.type === "done") item.done(message);
    else if (message.type === "error") item.error();
  };
  post({ type: "hello" });
})();
</script>
