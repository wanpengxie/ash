<!doctype html>
<html lang="zh">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141415" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Ash</title>
<!--
  The app shell is bundled into this page at build time. It uses the same
  documented HTTP and event-stream routes locally and through a paired gateway.
-->
<style>
:root{--bg:#f7f7f5;--fg:#1c1c1e;--mute:#8a8a8e;--line:#e6e6e3;--me:#2f6bff;--me-fg:#fff;--card:#fff;--chip:#efefec;--err:#d33;--ok:#2bb673;--warn:#f5a623}
@media (prefers-color-scheme:dark){:root{--bg:#141415;--fg:#ececee;--mute:#8d8d93;--line:#2a2a2d;--me:#3b74ff;--card:#1e1e20;--chip:#242427;--err:#ff6b6b}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,system-ui,"PingFang SC","Noto Sans SC",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:.6rem;padding:.65rem 1rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
header h1{font-size:1.05rem;margin:0;font-weight:650;letter-spacing:.02em}
header select{border:0;background:none;color:var(--fg);font:inherit;font-weight:650;font-size:1.05rem;padding:0;max-width:40vw}
#presence{display:flex;align-items:center;gap:.65rem;min-width:0;text-align:left;max-width:55%;padding:0;border:0;background:none;color:var(--fg);cursor:pointer}
#presence:focus-visible{outline:2px solid var(--me);outline-offset:4px;border-radius:8px}
#identity{display:flex;flex-direction:column;min-width:0}
#title{font-size:1.05rem;font-weight:650;line-height:1.25}
#connection{font-size:.72rem;color:var(--mute);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#presenceNotice{position:absolute;top:100%;left:1rem;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.3rem .6rem;font-size:.75rem;color:var(--mute)}
#presenceNotice:empty{display:none}
#face{position:relative;flex:none;width:40px;height:40px}
.face{display:block;width:100%;height:100%;border-radius:12px;background:var(--chip);object-fit:contain}
#dot{position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border:2px solid var(--bg);border-radius:50%;background:var(--mute)}#dot.idle{background:var(--ok)}#dot.running{background:var(--warn);animation:p 1s infinite}#dot.error{background:var(--err)}
@keyframes p{50%{opacity:.35}}
#state{color:var(--mute);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:none;border:0;color:var(--fg);font-size:1.2rem;cursor:pointer;padding:.2rem .4rem;position:relative}
#badge{position:absolute;top:0;right:0;background:var(--err);color:#fff;border-radius:999px;font-size:.6rem;padding:0 .3rem;display:none}
main{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.55rem;max-width:760px;width:100%;margin:0 auto}
.msg{max-width:86%;padding:.55rem .8rem;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.me{align-self:flex-end;background:var(--me);color:var(--me-fg);border-bottom-right-radius:5px}
.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.ai pre{background:var(--chip);padding:.5rem;border-radius:8px;overflow-x:auto;white-space:pre}
.ai code{background:var(--chip);padding:0 .25rem;border-radius:4px;font-size:.9em}
.ai a{color:var(--me)}
.from{font-size:.75rem;color:var(--mute);margin:-.2rem .3rem -.35rem}.from.r{align-self:flex-end}.from.l{align-self:flex-start}
.delivery{align-self:flex-end;color:var(--mute);font-size:.72rem;margin:-.4rem .3rem .15rem}
.msg.ai.group-first{border-bottom-left-radius:5px}.msg.ai.group-middle{border-top-left-radius:5px;border-bottom-left-radius:5px}.msg.ai.group-last{border-top-left-radius:5px}
.reactions{display:flex;gap:.25rem;margin-top:.3rem}.reaction{background:var(--chip);border-radius:999px;padding:.05rem .35rem;font-size:.82rem}
.attachment{display:inline-block;border:0;border-radius:7px;background:var(--chip);color:var(--fg);padding:.15rem .45rem;font:inherit;font-size:.8rem;text-decoration:none;cursor:pointer;max-width:100%;overflow-wrap:anywhere}
.chip{align-self:center;background:var(--chip);color:var(--mute);font-size:.78rem;padding:.2rem .7rem;border-radius:999px;max-width:92%;text-align:center}
.tool{align-self:flex-start;font-size:.78rem;color:var(--mute);padding:0 .4rem;cursor:pointer;max-width:92%}
.tool pre{white-space:pre-wrap;margin:.3rem 0 0;font-size:.75rem;background:var(--chip);padding:.4rem;border-radius:6px;display:none;max-height:40vh;overflow:auto}
.tool.open pre{display:block}.tool .x{color:var(--err)}
.card{align-self:stretch;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:10px;padding:.55rem .8rem}
.card b{display:block}.card small{color:var(--mute)}.card.ask{border-left-color:var(--me)}.card.done{opacity:.6}
.card-image{display:block;max-width:100%;max-height:50vh;object-fit:contain;margin-top:.4rem;border-radius:8px}
.card-custom{width:min(18rem,100%);padding:.35rem .5rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
.card pre{white-space:pre-wrap;font-size:.78rem;background:var(--chip);padding:.4rem;border-radius:6px;max-height:30vh;overflow:auto;margin:.4rem 0}
.btn{border:0;border-radius:8px;padding:.35rem .9rem;font:inherit;font-size:.9rem;cursor:pointer;background:var(--me);color:#fff;margin:.2rem .4rem .2rem 0}
.btn.gray{background:var(--chip);color:var(--fg)}.btn.red{background:var(--err)}
.err{color:var(--err);font-size:.8rem;align-self:flex-start}
.typing{align-self:flex-start;color:var(--mute);font-size:.85rem;display:flex;align-items:center;gap:.5rem}.typing .face{width:32px;height:32px;border-radius:10px}
.hello{margin:auto;text-align:center;color:var(--mute);font-size:.9rem}.hello .face{width:132px;height:132px;border-radius:32px;margin:0 auto .6rem}
footer{border-top:1px solid var(--line);padding:.6rem;background:var(--bg);padding-bottom:max(.6rem,env(safe-area-inset-bottom))}
footer form{display:flex;gap:.5rem;max-width:760px;margin:0 auto}
textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:.55rem .75rem;font:inherit;max-height:40vh}
footer button{border:0;background:var(--me);color:#fff;border-radius:12px;padding:0 1rem;font-size:1rem;cursor:pointer}
footer button.stop{background:var(--err)}
#attach{background:var(--chip);color:var(--fg);padding:0 .8rem;font-size:1.15rem}
.pending-note,#selected{display:block;color:var(--mute);font-size:.72rem;padding:.1rem .5rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pending{display:flex;gap:.4rem;flex-wrap:wrap;max-width:760px;margin:0 auto .4rem}#pending:empty{display:none}
.pa{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.25rem .5rem;font-size:.8rem;display:flex;align-items:center;gap:.3rem;max-width:12rem}
.pa img{width:3rem;height:3rem;object-fit:cover;border-radius:6px}.pa span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pa b{cursor:pointer;color:var(--mute);font-weight:400;padding-left:.2rem}
.atts{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.35rem}.atts img{max-width:14rem;max-height:14rem;border-radius:10px;display:block}
.atts a{font-size:.8rem;background:rgba(255,255,255,.18);border-radius:8px;padding:.15rem .5rem;color:inherit;text-decoration:none}
.ai .atts a{background:var(--chip)}
#drawer{position:fixed;inset:0 0 0 auto;width:min(420px,94vw);background:var(--bg);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s;z-index:5;overflow-y:auto;padding:0 1rem 2rem}
#drawer.open{transform:none;box-shadow:-8px 0 24px #0002}
#agentSheet{position:fixed;inset:0 0 0 auto;width:min(480px,96vw);background:var(--bg);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s;z-index:6;overflow-y:auto;padding:0 1rem 2rem}
#agentSheet.open{transform:none;box-shadow:-8px 0 24px #0002}
#agentSheetHeader{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);padding:.7rem 0;z-index:2}
#agentSheetHeader h2{font-size:1rem;margin:0}#agentClose{border:0;background:var(--chip);color:var(--fg);border-radius:8px;padding:.25rem .7rem;font:inherit;cursor:pointer}
#agentTabs{display:flex;flex-wrap:wrap;gap:.3rem;padding:.35rem 0;border-bottom:1px solid var(--line)}
#agentTabs button{border:0;background:var(--chip);color:var(--fg);border-radius:8px;padding:.3rem .6rem;font:inherit;font-size:.85rem;cursor:pointer}
#agentTabs button[aria-selected=true]{background:var(--me);color:var(--me-fg)}
.activity-turn{padding:.65rem .75rem;margin:.55rem 0;background:var(--card);border:1px solid var(--line);border-radius:10px}.activity-turn.background{border-left:3px solid var(--me)}.activity-turn h3{margin:0;font-size:.9rem}.activity-time{color:var(--mute)}.activity-step{margin:.3rem 0;color:var(--mute);font-size:.82rem}
.activity-group{margin:.9rem 0 .35rem;color:var(--mute);font-size:.8rem;font-weight:600}
#progress{padding:.35rem 1rem;border-top:1px solid var(--line);background:var(--bg)}#progress[hidden]{display:none}.progress-button{display:block;width:min(760px,100%);margin:auto;padding:.2rem .4rem;border:0;background:transparent;color:var(--mute);font:inherit;font-size:.8rem;text-align:left;cursor:pointer}
.suggestion{display:flex;align-items:center;gap:.4rem;max-width:760px;margin:0 auto .4rem;padding:.35rem .55rem;border-radius:9px;background:var(--chip);font-size:.82rem}.suggestion span{flex:1}.suggestion button{border:0;background:var(--card);color:var(--fg);border-radius:6px;padding:.2rem .5rem;font:inherit;cursor:pointer}
#context{padding:.35rem 1rem;background:var(--bg)}#context[hidden]{display:none}.context-chip{display:flex;align-items:center;gap:.4rem;max-width:760px;margin:auto;color:var(--mute);font-size:.78rem}.context-chip button{border:0;background:var(--chip);color:var(--fg);border-radius:6px;padding:.1rem .4rem;cursor:pointer}
#agentPanel .markdown-source{display:block;width:100%;min-height:12rem;resize:vertical;margin:.5rem 0}
#agentPanel button{margin:.2rem .3rem .2rem 0}#agentPanel .editor-warning{color:var(--err)}
#tabs{display:flex;gap:.2rem;position:sticky;top:0;background:var(--bg);padding:.7rem 0 .5rem;border-bottom:1px solid var(--line);z-index:1}
#tabs button{border:0;background:none;color:var(--mute);font:inherit;font-size:.88rem;padding:.25rem .55rem;border-radius:8px;cursor:pointer}
#tabs button.on{background:var(--chip);color:var(--fg)}#tabs .close{margin-left:auto;font-size:1.1rem}
#drawer h2{font-size:.85rem;color:var(--mute);margin:1.1rem 0 .4rem;font-weight:600}
.row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.55rem .7rem;margin:.35rem 0;font-size:.86rem}
.row .t{font-weight:600}.row small{color:var(--mute)}.row .right{float:right}
.caps{margin-top:.25rem}.caps span{display:inline-block;font-size:.7rem;padding:0 .35rem;margin:.1rem;border-radius:4px;background:var(--chip);color:var(--mute)}.caps span.on{color:var(--ok)}
label{display:block;font-size:.82rem;color:var(--mute);margin:.5rem 0 .15rem}
input[type=text],input[type=password],input[type=url],select.f{width:100%;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:.45rem .6rem;font:inherit}
.check{display:flex;gap:.4rem;align-items:center;color:var(--fg);font-size:.85rem;margin:.2rem 0}
code.k{background:var(--chip);padding:.15rem .4rem;border-radius:5px;word-break:break-all;font-size:.85rem}
.muted{color:var(--mute);font-size:.82rem}
</style>
</head>
<body>
<header>
  <button id="presence" type="button" aria-label="打开 Ash 人物页"><span id="face"><img class="face" src="avatars/default.webp" alt=""><span id="dot"></span></span><span id="identity"><span id="title">Ash</span><span id="state">状态待同步</span></span></button><select id="agents" hidden></select>
  <span id="connection" role="status">连接中…</span><span id="presenceNotice" role="status"></span>
  <button id="menu" title="设备与设置">☰<span id="badge"></span></button>
</header>
<main id="log"></main>
<div id="progress" hidden aria-live="polite"></div>
<div id="context" hidden></div>
<footer><div id="suggestions"></div><div id="pending"></div><div id="selected"></div><form id="f"><button type="button" id="attach" title="图片或文件">📎</button><input type="file" id="file" multiple hidden><textarea id="t" rows="1" placeholder="跟 Ash 说点什么…"></textarea><button id="send">发送</button></form><small class="pending-note">未发送的文字和附件暂存在此浏览器，最多保留 7 天；仅送达确认后才移除附件副本。</small></footer>
<aside id="drawer"><div id="tabs"></div><div id="panel"></div></aside>
<aside id="agentSheet" aria-hidden="true"><div id="agentSheetHeader"><h2>Ash</h2><button id="agentClose" type="button" aria-label="关闭人物页">关闭</button></div><nav id="agentTabs" aria-label="人物页标签"></nav><div id="agentPanel"></div></aside>
