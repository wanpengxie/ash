*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,system-ui,"PingFang SC","Noto Sans SC",sans-serif;display:flex;flex-direction:column}

#state{color:var(--mute);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:none;border:0;color:var(--fg);font-size:1.2rem;cursor:pointer;padding:.2rem .4rem;position:relative}

#attach{background:var(--chip);color:var(--fg);padding:0 .8rem;font-size:1.15rem}

#pending{display:flex;gap:.4rem;flex-wrap:wrap;max-width:760px;margin:0 auto .4rem}#pending:empty{display:none}

.atts{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.35rem}.atts img{max-width:14rem;max-height:14rem;border-radius:10px;display:block}

.ai .atts a{background:var(--chip)}
#drawer{position:fixed;inset:0 0 0 auto;width:min(420px,94vw);background:var(--bg);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s;z-index:5;overflow-y:auto;padding:0 1rem 2rem}
#drawer.open{transform:none;box-shadow:-8px 0 24px #0002}
