org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# The screen helper app (android/screen). Ash bundles it and offers to update an older one.
ashScreenVersionCode=8
# The senses helper app (android/senses): location, motion and health. Ash bundles it like the screen helper.
ashSensesVersionCode=2
# The apps shell (android/apps): draws the owner's apps (MCP Apps views), one task and home-screen icon each.
ashAppsVersionCode=1
